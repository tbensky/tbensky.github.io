<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Lookup</title>
<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  margin-top:100px;
}
input{
  padding:8px;
  font-size:16px;
}
button{
  padding:8px 12px;
  font-size:16px;
  cursor:pointer;
}
#result{
  margin-top:20px;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>
<body>

<h2>Enter Last 4 Digits of Your ID</h2>
<input type="text" id="sid" placeholder="e.g. 5829">
<button onclick="lookup()">Submit</button>

<div id="result"></div>

<script>
(function(){

// Base64 encoded version of your dataset
const DATA =
"NTgyOSwyLDMsNAo2MTU0LDMsNCw2LDEwCjYxMjAsMSw0LDUsNgo3NTk4LDgKMDgyNSwxMAowMTgwLDUKNzQ2OSwKNzI1MSwzLDUsOSwxMQoxNDE4LDEsMyw0LDUsOQowMTY3LDEwCjM1NTksNCw1CjY3NDgsMyw0CjM3NDUsCjc1NjQsCjc3MTMsMSwyLDMKMjYzNiwKNDA4NiwzLDUsMTAsMTEKNDk5NiwKODQ4NSwKMDU1MywyLDMsNCw1LDEwLDExCjc3ODMsNAoxNjQyLAoyNTI2LAo3ODA3LDUsOCw5CjA0OTIsMyw0LDUKOTU4OSwzLDQKMTg2OCwxLDMsNCw1LDgsMTAKODM4MSwxLDIsMyw0LDUsOCwxMAo5OTY3LAoyOTAxLDMsNCw1LDYsMTAKMTY5NCwzLDUsOSwxMCwxMQozOTA4LAo5MzY0LDIKNTMyNCwKNjkxNiwxLDQsNyw4LDExCjk4MDQsMiwzLDUsMTAKODk3NCwKODM5Miw1LDgKNjQxNiwyLDMsNCw1LDgsOSwxMCwxMQo3NDIzLDEwCjIyODksMiwzLDQsNSwxMCwxMQo1NDc0LDIsNCw1LDgsMTAKNTAzMywyLDMsNQo3NTkyLDEsMiwzLDQsNSw2LDcsOCw5LDEwLDExCjAzODIsNQoxODUxLAo1NjQ0LDMsOCw5";

const map = {};
atob(DATA).split("\n").forEach(line=>{
  const parts = line.split(",");
  const id = parts.shift();
  map[id] = parts.join(","); // may be empty string
});

window.lookup = function(){
  let id = document.getElementById("sid").value.trim();

  // pad if user types 167 instead of 0167
  if(/^\d+$/.test(id) && id.length < 4){
    id = id.padStart(4,"0");
  }

  const result = document.getElementById("result");

  if(map.hasOwnProperty(id)){
    result.textContent = map[id] 
      ? "Your result: " + map[id] 
      : "No entry for this ID.";
  } else {
    result.textContent = "ID not found.";
  }
}

})();
</script>

</body>
</html>
